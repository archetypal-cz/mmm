server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # nginx 1.27 mime.types already maps .wasm to application/wasm

    gzip on;
    gzip_types application/wasm application/javascript text/javascript text/css text/plain;
    gzip_min_length 1024;
    # behind a reverse proxy (Caddy adds Via:) nginx would skip gzip by default
    gzip_proxied any;
    gzip_vary on;

    # file names are not versioned yet: let browsers revalidate (ETag) so
    # a new build shows up right away; 304s are cheap
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~ \.webmanifest$ {
        types { application/manifest+json webmanifest; }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
