# Vlastní hosting / local self-hosting:
#   docker compose -f deploy/compose.yml up -d          (hotový obraz z GHCR)
#   docker compose -f deploy/compose.yml up -d --build  (build ze zdrojáků, pár minut)
# Pak http://localhost:8080/. Žádný backend, žádná data na serveru:
# uložené hry jsou v localStorage prohlížeče.
services:
  mmm:
    image: ghcr.io/archetypal-cz/mmm:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    ports:
      - "8080:80"
